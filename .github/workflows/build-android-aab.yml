name: Build Android AAB and APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Do not install the obsolete Android SDK package named "tools".
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Create release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

      - name: Read keystore alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          KEY_ALIAS="$(keytool -list -v -keystore upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" | awk -F': ' '/Alias name:/{print $2; exit}')"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Build release AAB and APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: >
          gradle :app:bundleRelease :app:assembleRelease --no-daemon
          -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          -PKEY_ALIAS="$KEY_ALIAS"
          -PKEY_PASSWORD="$KEY_PASSWORD"

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: teacher-assistant-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: teacher-assistant-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
